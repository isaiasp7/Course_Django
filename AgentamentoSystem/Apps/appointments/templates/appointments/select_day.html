<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Escolha a Data - Agendamento</title>
    <!-- Google Fonts: Inter -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-color: #0a0a0a;
        --card-bg: #161616;
        --accent: #39ff14;
        --accent-dim: rgba(57, 255, 20, 0.1);
        --text-main: #ffffff;
        --text-dim: #888888;
        --error: #ff4b4b;
        --radius: 12px;
        --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Inter", sans-serif;
      }

      body {
        background-color: var(--bg-color);
        color: var(--text-main);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        overflow: hidden;
      }

      /* Container */
      .app-container {
        width: 100%;
        max-width: 400px;
        min-height: 600px;
        background: var(--bg-color);
        position: relative;
        padding: 24px;
        display: flex;
        flex-direction: column;
      }

      /* Componentes Genéricos */
      h1 {
        font-size: 24px;
        font-weight: 700;
        margin-bottom: 8px;
      }

      p {
        color: var(--text-dim);
        font-size: 14px;
        margin-bottom: 24px;
      }

      .btn-primary {
        background: var(--accent);
        color: black;
        border: none;
        padding: 16px;
        border-radius: var(--radius);
        font-weight: 700;
        cursor: pointer;
        transition: var(--transition);
        width: 100%;
      }

      .btn-primary:disabled {
        background: #222;
        color: #555;
        cursor: not-allowed;
      }

      .btn-primary:hover:not(:disabled) {
        box-shadow: 0 0 20px var(--accent-dim);
      }

      /* TELA 2: CALENDÁRIO */
      .toggle-container {
        display: flex;
        background: var(--card-bg);
        padding: 4px;
        border-radius: 10px;
        margin-bottom: 24px;
      }

      .toggle-btn {
        flex: 1;
        padding: 10px;
        text-align: center;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
        color: var(--text-dim);
        background: transparent;
        border: none;
        transition: var(--transition);
      }

      .toggle-btn.active {
        background: #333;
        color: var(--accent);
      }

      .calendar-grid {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 8px;
        margin-bottom: 24px;
      }

      .day {
        aspect-ratio: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        border-radius: 8px;
        cursor: pointer;
        transition: var(--transition);
        border: 1px solid #333;
      }

      .day.disabled {
        color: #333;
        cursor: not-allowed;
        background: #0a0a0a;
      }

      .day.fully-booked {
        opacity: 0.35;
        text-decoration: line-through;
      }

      .day.selected {
        background: var(--accent);
        color: black;
        font-weight: bold;
        border-color: var(--accent);
      }

      .day:not(.disabled):not(.selected):hover {
        background: var(--accent-dim);
        border-color: var(--accent);
      }

      .spacer {
        height: 200px;
      }

      .btn-secondary {
        background: transparent;
        color: var(--accent);
        border: none;
        text-align: center;
        margin-top: 16px;
        cursor: pointer;
        font-size: 14px;
        padding: 10px;
      }

      .btn-secondary:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="app-container">
      <!-- TELA 2: CALENDÁRIO -->
      <section id="screen-calendar" class="screen">
        <h1>Escolha a Data</h1>
        <p>Selecione um dia disponivel.</p>

        <div class="toggle-container" id="monthToggle">
          <!-- Gerado por JS -->
        </div>

        <div class="calendar-grid" id="calendarGrid">
          <!-- Gerado por JS -->
        </div>

        <div class="spacer"></div>
        <button
          class="btn-primary"
          id="btn-next-calendar"
          disabled
          onclick="goToStep(3)"
        >
          Próximo Passo
        </button>
        <button class="btn-secondary" onclick="goBack()">Voltar</button>
      </section>
    </div>

    <script>
      // Estado da Aplicação
      let state = {
          step: 2,
          monthIndex: 0,
          selectedDay: null,
          selectedTime: null,
          services: [],
          total: 0
      };

      const calendarMonths = JSON.parse('{{ calendar_months_json|escapejs }}');
      const fullyBookedDays = new Set(JSON.parse('{{ fully_booked_days_json|escapejs }}'));

      function getTodayKey() {
          const today = new Date();
          const year = today.getFullYear();
          const month = String(today.getMonth() + 1).padStart(2, '0');
          const day = String(today.getDate()).padStart(2, '0');
          return `${year}-${month}-${day}`;
      }

        // Normalizar os dados do calendário para evitar problemas de tipo ao alternar meses
        calendarMonths.forEach((monthData) => {
            monthData.year = Number(monthData.year);
            monthData.month = Number(monthData.month);
            monthData.days = Number(monthData.days);
        });

        // Verificar se um dia está completamente indisponível
        function getDayKey(monthData, day) {
            const year = Number(monthData.year);
            const month = Number(monthData.month);
            return `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        }

        function isDayFullyBooked(monthData, day) {
            return fullyBookedDays.has(getDayKey(monthData, day));
        }

      // Obter data atual e inicializar estado
      function initializeCalendar() {
          state.monthIndex = 0;
          renderMonthToggle();
          renderCalendar();
      }

      // Calendário Lógica
      function switchMonth(index) {
          state.monthIndex = index;
          state.selectedDay = null;
          document.getElementById('btn-next-calendar').disabled = true;
          renderMonthToggle();
          renderCalendar();
      }

      function renderMonthToggle() {
          const toggle = document.getElementById('monthToggle');
          toggle.innerHTML = '';

          calendarMonths.forEach((monthData, index) => {
              const button = document.createElement('button');
              button.classList.add('toggle-btn');
              if (index === state.monthIndex) {
                  button.classList.add('active');
              }
              button.type = 'button';
              button.innerText = monthData.label;
              button.addEventListener('click', () => switchMonth(index));
              toggle.appendChild(button);
          });
      }

      function renderCalendar() {
          const grid = document.getElementById('calendarGrid');
          grid.innerHTML = '';
          const monthData = calendarMonths[state.monthIndex];
          const todayKey = getTodayKey();

          for (let i = 1; i <= Number(monthData.days); i++) {
              const dayEl = document.createElement('div');
              dayEl.classList.add('day');
              dayEl.innerText = i;
              const dayKey = getDayKey(monthData, i);
              dayEl.dataset.date = dayKey;

              const isPast = dayKey < todayKey;
              const isFullyBooked = isDayFullyBooked(monthData, i);
              const isDisabled = isPast || isFullyBooked;

              if (isDisabled) {
                  dayEl.classList.add('disabled');
                  if (isFullyBooked) {
                      dayEl.classList.add('fully-booked');
                      dayEl.title = 'Todos os horarios deste dia estao ocupados';
                  }
              } else {
                  dayEl.addEventListener('click', () => selectDay(i, dayEl));
              }

              grid.appendChild(dayEl);
          }
      }

      function selectDay(day, el) {
          document.querySelectorAll('.day').forEach(d => d.classList.remove('selected'));
          el.classList.add('selected');
          const monthName = calendarMonths[state.monthIndex].label;
          state.selectedDay = `${day} de ${monthName}`;
          document.getElementById('btn-next-calendar').disabled = false;
      }

      // Navegação
      function goToStep(step) {
          if (state.selectedDay) {
              window.location.href = `/appointments/selectHour/?date=${encodeURIComponent(state.selectedDay)}`;
          }
      }

      function goBack() {
          window.history.back();
      }

      // Init
      initializeCalendar();
    </script>
  </body>
</html>
